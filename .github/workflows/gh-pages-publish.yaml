name: GitHub Pages Publish

on:
  workflow_call:
    inputs:
      any-branch:
        description: "Publish from any branch the caller runs on, not only the default branch. The caller must restrict allowed branches in its trigger."
        required: false
        type: boolean
        default: false
      java-version:
        required: false
        type: string
        default: '21'
      semvertag:
        required: true
        type: string
      folder:
        required: false
        type: string
        default: 'build/docs/javadoc'

permissions:
  contents: write

jobs:
  publish:
    if: inputs.any-branch || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    concurrency:
      group: docs
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper
      - name: Gradle doc tasks
        run: ./gradlew javadoc
      - name: Deploy Docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ${{ inputs.folder }}
          target-folder: ${{ inputs.semvertag }}